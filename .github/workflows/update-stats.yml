name: Update GitHub Stats

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate GitHub stats
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p profile

          node -e '
          const fs = require("fs");

          async function get(url) {
            const res = await fetch(url, {
              headers: {
                Authorization: `Bearer ${process.env.GH_TOKEN}`,
                Accept: "application/vnd.github+json",
                "X-GitHub-Api-Version": "2022-11-28"
              }
            });

            if (!res.ok) {
              throw new Error(`GitHub API ${res.status}: ${await res.text()}`);
            }

            return res.json();
          }

          async function main() {
            const username = "taijulsir";

            const user = await get(
              `https://api.github.com/users/${username}`
            );

            const repos = await get(
              `https://api.github.com/users/${username}/repos?per_page=100`
            );

            const stars = repos.reduce(
              (total, repo) => total + repo.stargazers_count,
              0
            );

            const forks = repos.reduce(
              (total, repo) => total + repo.forks_count,
              0
            );

            const svg = `<svg
              xmlns="http://www.w3.org/2000/svg"
              width="495"
              height="180"
              viewBox="0 0 495 180"
            >
              <rect
                width="495"
                height="180"
                rx="12"
                fill="#0d1117"
                stroke="#30363d"
              />

              <text
                x="25"
                y="38"
                fill="#f0f6fc"
                font-family="Arial, sans-serif"
                font-size="21"
                font-weight="700"
              >
                Taijul's GitHub Stats
              </text>

              <line
                x1="25"
                y1="52"
                x2="470"
                y2="52"
                stroke="#30363d"
              />

              <text
                x="25"
                y="82"
                fill="#8b949e"
                font-family="Arial, sans-serif"
                font-size="13"
              >
                Public Repositories
              </text>

              <text
                x="25"
                y="108"
                fill="#f0f6fc"
                font-family="Arial, sans-serif"
                font-size="22"
                font-weight="700"
              >
                ${user.public_repos}
              </text>

              <text
                x="175"
                y="82"
                fill="#8b949e"
                font-family="Arial, sans-serif"
                font-size="13"
              >
                Total Stars
              </text>

              <text
                x="175"
                y="108"
                fill="#f0f6fc"
                font-family="Arial, sans-serif"
                font-size="22"
                font-weight="700"
              >
                ${stars}
              </text>

              <text
                x="325"
                y="82"
                fill="#8b949e"
                font-family="Arial, sans-serif"
                font-size="13"
              >
                Followers
              </text>

              <text
                x="325"
                y="108"
                fill="#f0f6fc"
                font-family="Arial, sans-serif"
                font-size="22"
                font-weight="700"
              >
                ${user.followers}
              </text>

              <line
                x1="25"
                y1="130"
                x2="470"
                y2="130"
                stroke="#30363d"
              />

              <text
                x="25"
                y="155"
                fill="#8b949e"
                font-family="Arial, sans-serif"
                font-size="13"
              >
                Following: ${user.following}
              </text>

              <text
                x="175"
                y="155"
                fill="#8b949e"
                font-family="Arial, sans-serif"
                font-size="13"
              >
                Forks: ${forks}
              </text>

            </svg>`;

            fs.writeFileSync("profile/stats.svg", svg);
            console.log("stats.svg generated successfully");
          }

          main().catch(error => {
            console.error(error);
            process.exit(1);
          });
          '

      - name: Verify generated stats
        run: |
          test -s profile/stats.svg
          grep -q "Taijul" profile/stats.svg
          echo "stats.svg verified successfully"

      - name: Commit updated stats
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add profile/stats.svg

          if git diff --cached --quiet; then
            echo "No stats changes to commit"
            exit 0
          fi

          git commit -m "Update GitHub profile stats"
          git push
